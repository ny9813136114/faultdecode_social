# Make one Short on GitHub's servers: Actions tab > "Make a Short" > Run workflow,
# type a guide id like ac/lg/ch38, then download the "short-..." zip from the run.
# This repo is public, so these minutes are free.
name: Make a Short
on:
  workflow_dispatch:
    inputs:
      guide:
        description: Guide id, e.g. ac/lg/ch38
        required: true
      format:
        description: Format (blank = best for this guide)
        required: false
        type: choice
        options: ['', meaning, danger, quiz, story]
      theme:
        description: Look (blank = automatic)
        required: false
        type: choice
        options: ['', studio, paper, device, cream, teal]
      upload:
        description: 'YouTube: blank = no upload, "now", "private" (test) or "YYYY-MM-DD HH:MM" IST'
        required: false
permissions:
  contents: write
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci && npx playwright install --with-deps chromium
      - run: pip install edge-tts
      - name: Render
        run: |
          node bin/make-short.js "${{ inputs.guide }}" --voice edge \
            --guides-url https://faultdecode.com/data/guides.json \
            ${{ inputs.format && format('--format {0}', inputs.format) || '' }} \
            ${{ inputs.theme && format('--theme {0}', inputs.theme) || '' }}
      - name: Upload to YouTube
        if: inputs.upload != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          WHEN: ${{ inputs.upload }}
        run: |
          node bin/upload.js out/* "$WHEN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name the download
        id: name
        run: echo "slug=$(echo '${{ inputs.guide }}' | tr '/' '-' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ steps.name.outputs.slug }}
          path: |
            out/*/short.mp4
            out/*/*.txt
            out/*/script.json
          retention-days: 14
      # Also keep the latest Short on the "latest-short" branch (one commit, replaced each run),
      # so it can be checked without signing in to download the zip.
      - name: Save to latest-short branch
        run: |
          mkdir /tmp/pub && cp -r out/*/short.mp4 out/*/*.txt out/*/*.json /tmp/pub/
          cd /tmp/pub && git init -q -b latest-short
          git add -A && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Short: ${{ inputs.guide }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" latest-short
